name: Report Bug
description: "Report a bug."
body:
  - type: markdown
    attributes:
      value: "A bug/crash report with sufficient information and logs to reproduce and track down."
  - type: input
    id: discord
    attributes:
      label: Your BTW Discord Username
      description: Leave empty if you don't have one, but this will make it harder to contact you if we need additional info.
      placeholder: "Example: fakeusername1234"
  - type: input
    id: version
    attributes:
      label: Mod Version
      description: "What version of the Mod are you using?"
      placeholder: "Example: 1.0.0"
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Bug Report
      description: "Relevant information, as well as relevant logs attached such as `logs/latest.log."
      placeholder: "Example: https://mclo.gs/ OR submit the file to github by dragging it to this textbox."
    validations:
      required: true
  - type: dropdown
    id: java
    attributes:
      label: Java Version
      description: What Java version are you using? It's worth mentioning that if you play on Java9+ you should try update to latest minor release (e.g. prefer Java 17.0.6 over 17.0.2) of that version.
      options:
        - Java 17
        - Java 21
        - Other (Please Specify)
    validations:
      required: true
  - type: textarea
    id: btwversion
    attributes:
      label: BTW Version
      description: "The version of Better than wolves you are using, should be 3.x.x, *IT IS NOT 1.6.4*"
      placeholder: "BTW version goes here, Example: 3.0.2"
    validations:
      required: true
  - type: textarea
    id: modlist
    attributes:
      label: Addon List
      description: "List of addons, ideally a minimal reproducible set."
      placeholder: "List of addons goes here"
    validations:
      required: true
  - type: checkboxes
    id: final
    attributes:
      label: Final Checklist
      description: Certify that you read things
      options:
        - label: "I have searched the issues and haven't found a similar issue."
          required: true


